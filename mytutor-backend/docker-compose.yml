services:
  db:
    image: postgres:15-alpine
    container_name: etutor-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: etutor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - etutor_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etutor-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etutor-api
    environment:
      DB_NAME: etutor_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      DEBUG: "True"
      DEVELOPMENT_URL: http://localhost:8000
      FRONT_END_URL_DEV: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - etutor_api_media:/app/media
    networks:
      - etutor-net

volumes:
  etutor_api_pgdata:
  etutor_api_media:

networks:
  etutor-net:
    driver: bridge
