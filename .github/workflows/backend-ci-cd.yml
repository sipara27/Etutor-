name: Backend CI/CD

on:
  pull_request:
    paths:
      - "mytutor-backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "mytutor-backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: etutor_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-for-production
      DEBUG: "False"
      DB_NAME: etutor_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEVELOPMENT_URL: http://localhost:8000/
      PRODUCTION_URL: https://api.example.com/
      FRONT_END_URL_DEV: http://localhost:3000/
      FRONT_END_URL_PROD: https://example.com/
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: mytutor-backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2-dev pkg-config

      - name: Install Python dependencies
        working-directory: mytutor-backend
        run: |
          python -m pip install --upgrade pip "setuptools<82" wheel
          pip install -r requirements.txt

      - name: Validate Django application
        working-directory: mytutor-backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test --noinput

      - name: Create backend deployment archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude='*/.env' \
            --exclude=SECRET_KEY \
            --exclude='*/SECRET_KEY' \
            --exclude=.venv \
            --exclude=venv \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            --exclude=database_dumps \
            --exclude=media \
            --exclude=staticfiles \
            -C mytutor-backend \
            -czf "$RUNNER_TEMP/mytutor-backend-${GITHUB_SHA}.tar.gz" .

      - name: Upload backend deployment archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/mytutor-backend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy backend to production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-backend
      url: https://api.mytutor.com.et
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      VENV_PATH: ${{ secrets.VENV_PATH }}
    steps:
      - name: Download backend deployment archive
        uses: actions/download-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$VENV_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          echo "DEPLOY_PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload backend release
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/mytutor-backend-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.release-${GITHUB_SHA}.tar.gz"

      - name: Activate backend release
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; tar -xzf '.release-${GITHUB_SHA}.tar.gz'; rm -f '.release-${GITHUB_SHA}.tar.gz'; '$VENV_PATH/bin/python' -m pip install -r requirements.txt; '$VENV_PATH/bin/python' manage.py check --deploy; '$VENV_PATH/bin/python' manage.py migrate --noinput; '$VENV_PATH/bin/python' manage.py collectstatic --noinput; mkdir -p tmp; touch tmp/restart.txt"

      - name: Verify backend deployment
        env:
          PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL || 'https://api.mytutor.com.et/' }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
