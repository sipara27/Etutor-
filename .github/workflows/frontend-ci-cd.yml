name: Frontend CI/CD

on:
  pull_request:
    paths:
      - "mytutor-frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "mytutor-frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package frontend
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://api.mytutor.com.et' }}
      NEXT_PUBLIC_CORS_URL: ${{ vars.NEXT_PUBLIC_CORS_URL || 'https://cors.nisirtech.com' }}
    steps:
      - name: Check out monorepo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mytutor-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: mytutor-frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: mytutor-frontend
        run: npm run lint

      - name: Build production frontend
        working-directory: mytutor-frontend
        run: npm run build

      - name: Create frontend deployment archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: mytutor-frontend
        run: |
          release_dir="$RUNNER_TEMP/frontend-release"
          mkdir -p "$release_dir/.next"
          cp -a .next/standalone/. "$release_dir/"
          cp -a .next/static "$release_dir/.next/static"
          cp -a public "$release_dir/public"
          tar -C "$release_dir" -czf "$RUNNER_TEMP/mytutor-frontend-${GITHUB_SHA}.tar.gz" .

      - name: Upload frontend deployment archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/mytutor-frontend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy frontend to production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-frontend
      url: https://mytutor.com.et
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Download frontend deployment archive
        uses: actions/download-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          echo "DEPLOY_PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload frontend release
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/mytutor-frontend-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.release-${GITHUB_SHA}.tar.gz"

      - name: Activate frontend release
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; tar -xzf '.release-${GITHUB_SHA}.tar.gz'; rm -f '.release-${GITHUB_SHA}.tar.gz'; mkdir -p tmp; touch tmp/restart.txt"

      - name: Verify frontend deployment
        env:
          PRODUCTION_URL: ${{ vars.FRONTEND_PRODUCTION_URL || 'https://mytutor.com.et/' }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "$PRODUCTION_URL" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
